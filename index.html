<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#145b59" />
  <title>つづり｜家計簿</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap');
    :root{--ink:#172121;--muted:#6d7776;--paper:#f6f3ea;--paper-deep:#ece7da;--line:#d8d2c4;--teal:#145b59;--teal-2:#0d4543;--yellow:#f4c94d;--red:#c94e45;--green:#2d7560;--white:#fffdf8;--r:16px}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif} button,input,select{font:inherit} button{cursor:pointer}
    .app{max-width:1180px;margin:auto;padding:28px 34px 70px}.top{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 0 30px;border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{background:var(--teal);color:var(--yellow);width:38px;height:38px;display:grid;place-items:center;font-family:"DM Mono";font-size:23px;font-weight:bold;transform:rotate(-5deg)}.brand h1{margin:0;font-size:23px;letter-spacing:.08em}.brand small,.eyebrow{font-family:"DM Mono";font-size:11px;letter-spacing:.08em;color:var(--muted)}
    .month-control{display:flex;align-items:center;gap:6px}.month-control button{border:1px solid var(--line);background:transparent;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--ink)}#monthLabel{min-width:112px;text-align:center;font-weight:700}
    .main-grid{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:52px;margin-top:36px}.summary{display:grid;grid-template-columns:1.45fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}.summary>div{background:var(--white);padding:22px 24px}.balance{background:var(--teal)!important;color:white;position:relative;overflow:hidden}.balance:after{content:"";position:absolute;width:190px;height:190px;border:1px solid rgba(244,201,77,.7);border-radius:50%;right:-85px;top:-72px}.balance .eyebrow{color:#cce3dd}.amount{font-family:"DM Mono",monospace;font-size:42px;letter-spacing:-.06em;margin:9px 0 7px;position:relative;z-index:1}.delta{font-size:12px;color:#d5e7df;position:relative;z-index:1}.summary .label{color:var(--muted);font-size:12px}.income{color:var(--green);font-family:"DM Mono";font-size:26px;margin-top:14px}.expense{color:var(--red);font-family:"DM Mono";font-size:26px;margin-top:14px}
    .section-head{display:flex;align-items:end;justify-content:space-between;margin:42px 0 13px}.section-head h2{font-size:19px;margin:0}.filter{border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 2px;color:var(--ink);font-size:13px}
    .ledger{border-top:2px solid var(--ink)}.record{display:grid;grid-template-columns:40px 1fr auto 27px;gap:13px;align-items:center;padding:14px 3px;border-bottom:1px solid var(--line)}.record-icon{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#e4ede8;font-size:16px}.record-main{min-width:0}.record-title{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.record-meta{font-family:"DM Mono";font-size:10px;color:var(--muted);margin-top:3px}.record-amount{font-family:"DM Mono";font-size:14px;font-weight:500}.record-amount.exp{color:var(--red)}.record-amount.inc{color:var(--green)}.delete{border:0;background:transparent;color:#9da4a0;font-size:18px;padding:2px}.empty{padding:38px 8px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line)}
    aside{border-left:1px solid var(--line);padding-left:28px}.side-title{font-size:14px;margin:4px 0 22px}.category{margin:0 0 18px}.category-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:7px}.category-row strong{font-family:"DM Mono";font-weight:500}.bar{height:6px;background:var(--paper-deep);border-radius:8px;overflow:hidden}.bar i{height:100%;background:var(--teal);display:block;border-radius:8px}.tip{margin-top:40px;background:var(--yellow);padding:19px 18px 17px;transform:rotate(-1.3deg);box-shadow:3px 4px 0 rgba(23,33,33,.1)}.tip .eyebrow{color:#625014}.tip p{font-size:13px;line-height:1.7;margin:8px 0 0}
    .add{position:fixed;right:max(28px,calc((100vw - 1180px)/2));bottom:28px;border:0;border-radius:50%;width:62px;height:62px;background:var(--teal);color:white;font-size:31px;box-shadow:0 8px 20px #145b5955;transition:transform .18s}.add:hover{transform:rotate(90deg)}dialog{border:0;padding:0;background:transparent;max-width:min(460px,calc(100vw - 28px));width:100%}dialog::backdrop{background:#17212177}.modal{background:var(--white);border-radius:20px;padding:27px}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.modal h2{font-size:21px;margin:0}.close{border:0;background:transparent;font-size:25px}.type-tabs{display:flex;gap:6px;margin-bottom:18px}.type-tabs button{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 14px;font-size:13px}.type-tabs button.active{background:var(--teal);color:white;border-color:var(--teal)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px;font-size:12px;font-weight:700}.field.full{grid-column:1/-1}.field input,.field select{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink)}.save{border:0;background:var(--teal);color:white;padding:13px 16px;border-radius:8px;width:100%;margin-top:24px;font-weight:700}.message{font-size:12px;color:var(--red);min-height:15px;margin-top:10px}
    @media(max-width:760px){.app{padding:20px 18px 90px}.top{padding-bottom:22px}.main-grid{display:block;margin-top:24px}.summary{grid-template-columns:1fr 1fr}.balance{grid-column:1/-1}.amount{font-size:37px}.section-head{margin-top:32px}aside{border-left:0;border-top:1px solid var(--line);padding:25px 0 0;margin-top:34px}.categories{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}.tip{margin:30px 4px 0}.add{right:20px;bottom:20px}.record{grid-template-columns:35px 1fr auto 23px}.brand small{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><div class="brand-mark">つ</div><div><h1>つづり</h1><small>YOUR EVERYDAY LEDGER</small></div></div><div class="month-control"><button id="prevMonth" aria-label="前月">‹</button><span id="monthLabel"></span><button id="nextMonth" aria-label="翌月">›</button></div></header>
    <div class="main-grid"><section><div class="summary"><div class="balance"><div class="eyebrow">THIS MONTH'S BALANCE</div><div class="amount" id="balance">¥0</div><div class="delta" id="countText">まだ記録がありません</div></div><div><div class="label">収入</div><div class="income" id="income">+¥0</div><div class="label" style="margin-top:20px">支出</div><div class="expense" id="expense">-¥0</div></div></div>
      <div class="section-head"><div><div class="eyebrow">TRANSACTIONS</div><h2>明細</h2></div><select id="filter" class="filter" aria-label="カテゴリで絞り込み"><option value="">すべてのカテゴリ</option></select></div><div id="ledger" class="ledger"></div></section>
      <aside><div class="eyebrow">WHERE IT WENT</div><h2 class="side-title">支出の内訳</h2><div id="categories" class="categories"></div><div class="tip"><div class="eyebrow">SMALL NOTE</div><p id="tip">記録がたまると、今月のお金の流れがここに見えてきます。</p></div></aside>
    </div>
  </main>
  <button class="add" id="openModal" aria-label="明細を追加">＋</button>
  <dialog id="entryDialog"><form class="modal" id="entryForm"><div class="modal-head"><h2>明細を記録</h2><button type="button" class="close" id="closeModal" aria-label="閉じる">×</button></div><div class="type-tabs"><button type="button" data-type="expense" class="active">支出</button><button type="button" data-type="income">収入</button></div><input id="type" type="hidden" value="expense"><div class="form-grid"><label class="field full">内容<input id="title" required maxlength="40" placeholder="例：スーパーでの買い物"></label><label class="field">金額<input id="value" required type="number" min="1" inputmode="numeric" placeholder="0"></label><label class="field">日付<input id="date" required type="date"></label><label class="field full">カテゴリ<select id="category"></select></label></div><div id="message" class="message"></div><button class="save" type="submit">記録する</button></form></dialog>
  <script>
  (()=>{const C={expense:[['食費','🍚'],['日用品','🧺'],['交通','🚃'],['住まい','⌂'],['趣味','✦'],['医療','✚'],['その他','•']],income:[['給与','▰'],['副収入','↗'],['その他','＋']]};const key='tsuzuri-records-v1';let cursor=new Date();let data=JSON.parse(localStorage.getItem(key)||'[]');const $=s=>document.querySelector(s), yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);const dateVal=d=>d.toISOString().slice(0,10);
  const seed=()=>{if(data.length)return;const now=new Date(),m=now.getMonth(),y=now.getFullYear();data=[{id:1,title:'給与',value:285000,type:'income',category:'給与',date:dateVal(new Date(y,m,25))},{id:2,title:'スーパー',value:4280,type:'expense',category:'食費',date:dateVal(new Date(y,m,24))},{id:3,title:'定期券',value:6200,type:'expense',category:'交通',date:dateVal(new Date(y,m,22))},{id:4,title:'動画配信サービス',value:1490,type:'expense',category:'趣味',date:dateVal(new Date(y,m,19))}];save()};const save=()=>localStorage.setItem(key,JSON.stringify(data));
  function entries(){let a=data.filter(x=>{let d=new Date(x.date+'T00:00:00');return d.getFullYear()==cursor.getFullYear()&&d.getMonth()==cursor.getMonth()});if($('#filter').value)a=a.filter(x=>x.category===$('#filter').value);return a.sort((a,b)=>b.date.localeCompare(a.date))}
  function render(){const all=data.filter(x=>{let d=new Date(x.date+'T00:00:00');return d.getFullYear()==cursor.getFullYear()&&d.getMonth()==cursor.getMonth()});const inc=all.filter(x=>x.type==='income').reduce((s,x)=>s+x.value,0),exp=all.filter(x=>x.type==='expense').reduce((s,x)=>s+x.value,0);$('#monthLabel').textContent=cursor.toLocaleDateString('ja-JP',{year:'numeric',month:'long'});$('#balance').textContent=yen(inc-exp);$('#income').textContent='+'+yen(inc);$('#expense').textContent='-'+yen(exp);$('#countText').textContent=all.length?all.length+'件の記録 · 支出 '+yen(exp):'まだ記録がありません';
    const list=entries(),ledger=$('#ledger');ledger.innerHTML=list.length?list.map(x=>{let icon=(C[x.type].find(c=>c[0]===x.category)||['','•'])[1];return '<div class="record"><div class="record-icon">'+icon+'</div><div class="record-main"><div class="record-title">'+esc(x.title)+'</div><div class="record-meta">'+x.date.replaceAll('-','.')+' · '+x.category+'</div></div><div class="record-amount '+(x.type==='expense'?'exp':'inc')+'">'+(x.type==='expense'?'-':'+')+yen(x.value)+'</div><button class="delete" data-id="'+x.id+'" aria-label="削除">×</button></div>'}).join(''):'<div class="empty">この条件の明細はありません。右下の＋から記録しましょう。</div>';
    const sums={};all.filter(x=>x.type==='expense').forEach(x=>sums[x.category]=(sums[x.category]||0)+x.value);const cats=$('#categories');cats.innerHTML=Object.keys(sums).length?Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="category"><div class="category-row"><span>'+n+'</span><strong>'+yen(v)+'</strong></div><div class="bar"><i style="width:'+Math.round(v/exp*100)+'%"></i></div></div>').join(''):'<p class="eyebrow">支出を記録すると表示されます</p>';$('#tip').textContent=exp?'今月は「'+Object.entries(sums).sort((a,b)=>b[1]-a[1])[0][0]+'」が支出の中心です。':'記録がたまると、今月のお金の流れがここに見えてきます。';}
  function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function setType(t){$('#type').value=t;document.querySelectorAll('[data-type]').forEach(b=>b.classList.toggle('active',b.dataset.type===t));$('#category').innerHTML=C[t].map(c=>'<option>'+c[0]+'</option>').join('')}
  $('#prevMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()-1);render()};$('#nextMonth').onclick=()=>{cursor.setMonth(cursor.getMonth()+1);render()};$('#filter').onchange=render;$('#openModal').onclick=()=>{$('#entryForm').reset();setType('expense');$('#date').value=dateVal(new Date());$('#message').textContent='';$('#entryDialog').showModal()};$('#closeModal').onclick=()=>$('#entryDialog').close();document.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>setType(b.dataset.type));$('#entryForm').onsubmit=e=>{e.preventDefault();let value=Number($('#value').value);if(!value||value<1){$('#message').textContent='金額は1円以上で入力してください。';return}data.push({id:Date.now(),title:$('#title').value.trim(),value,type:$('#type').value,category:$('#category').value,date:$('#date').value});save();cursor=new Date($('#date').value+'T00:00:00');$('#entryDialog').close();render()};$('#ledger').onclick=e=>{let id=e.target.dataset.id;if(id){data=data.filter(x=>x.id!=id);save();render()}};seed();setType('expense');render()})()
  </script>
</body></html>
